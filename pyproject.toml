[project]
name = "reservoir"
version = "0.1.0"
description = "Reservoir computing written as neural circuit diagrams with PyNCD"
requires-python = ">= 3.14"
dependencies = [
    "einops>=0.8.2",
    "numpy>=2",
    "pyncd[diagrams,torch]",
    "torch>=2.15",
]

[dependency-groups]
dev = ["ty", "ruff", "pytest"]
tests = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reservoir"]

[tool.uv.sources]
# Upstream PyNCD ships no packaging metadata. This directory holds the metadata alone,
# as lock-resolution plumbing; the flake combines it with the pinned upstream source.
pyncd = { path = "third_party/pyncd" }
torch = { index = "pytorch-cpu" }

[tool.uv]
no-build-package = ["torch"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
import-not-found = "warn"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = []
